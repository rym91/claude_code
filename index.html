<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>¡Hola! Учим испанский</title>
  <meta name="description" content="Детское приложение для изучения испанских слов: карточки, викторина, аудирование и мемори.">
  <meta name="theme-color" content="#ff8fab">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇪🇸</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">🇪🇸</span>
      <div>
        <h1 class="topbar__title">¡Hola!</h1>
        <p class="topbar__subtitle">Учим испанский</p>
      </div>
    </div>

    <div class="topbar__stats">
      <span class="chip" title="Звёзды за игры">⭐ <b id="stat-stars">0</b></span>
      <span class="chip" title="Выученные слова">📚 <b id="stat-words">0</b></span>
      <span class="chip" title="Очки опыта">✨ <b id="stat-xp">0</b></span>
    </div>

    <div class="topbar__controls">
      <button id="toggle-music" class="icon-btn" type="button" aria-pressed="false" title="Включить музыку">🔇</button>
      <button id="toggle-sound" class="icon-btn" type="button" aria-pressed="true" title="Выключить звуки">🔔</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <p id="live" class="visually-hidden" role="status" aria-live="polite"></p>

  <noscript>
    <p class="noscript">Для работы приложения нужно включить JavaScript.</p>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
